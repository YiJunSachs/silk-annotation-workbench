<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silk · 标注工作台</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2313243d'/%3E%3Cpath d='M8 13V8h5m6 0h5v5m0 6v5h-5m-6 0H8v-5' fill='none' stroke='%23f7bd60' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=20260928-annotator"></head><body>
<header><div class="brand"><b>帛</b><div><strong>Silk 标注工作台</strong><small id="total">加载图片…</small></div></div><div class="head-actions"><a class="discussion-link" href="fragments.html">残卷保留讨论 ↗</a><span id="saveState" role="status">读取中</span><button id="saveFile" class="primary">保存标注文件</button><button id="exportOpen">导出标注 ↓</button></div></header>
<main><aside class="library"><div class="section-title"><strong>待复核图片</strong><button id="galleryToggle" class="subtle">全部图览</button></div><label class="search"><span>搜索编号或标注人</span><input id="search" placeholder="编号 / 标注人" autocomplete="off"></label><select id="filter" aria-label="筛选图片"><option value="all">全部问题图片</option><option value="pending">尚未完成</option><option value="reviewed">已完成复核</option><option value="需返工">需返工</option><option value="需修正">需修正</option><option value="待确认">待确认</option></select><nav id="fileList" aria-label="图片列表"></nav><footer>仅在本机运行 · 原数据保留</footer></aside>
<section class="workspace"><div class="document-bar"><div><h1 id="docName">标注编辑</h1><span id="docMeta"></span><span id="docAnnotator" class="doc-annotator"></span><button id="downloadOldDraft" class="subtle old-draft" hidden>下载旧草稿</button></div><label class="review-control"><input id="reviewed" type="checkbox">本页已完成复核</label></div><div class="tools"><div class="tool-group"><button id="selectMode" class="active" title="选择/移动框 V">选择 V</button><button id="drawMode" title="拖动新增矩形 B">补框 B</button><button id="panMode" title="拖动画布 H">平移 H</button></div><button id="undo" title="撤销 Ctrl/⌘ Z">↶ 撤销</button><button id="redo" title="重做 Ctrl/⌘ Shift Z">↷</button><div class="spacer"></div><button id="zoomOut" aria-label="缩小">−</button><button id="fit">适应</button><button id="zoomIn" aria-label="放大">＋</button><span id="zoomLabel">100%</span><label><input id="problemOnly" type="checkbox">仅问题框</label><label><input id="showBoxes" type="checkbox" checked>显示框</label></div>
<div id="canvas" tabindex="0" aria-label="标注画布，可选择框或拖动补框"><svg id="scene" xmlns="http://www.w3.org/2000/svg"><image id="sourceImage"/><g id="boxLayer"></g><g id="selectionLayer"></g></svg><div class="legend"><span style="color:#ff626b">重：重复</span><span style="color:#c797ff">字：录入</span><span style="color:#ff9b4b">空：空白</span><span style="color:#f3d45e">叠：重叠</span></div></div><div id="gallery" hidden></div><div class="canvas-foot"><span id="modeHelp">点击矩形框查看文字 · 滚轮缩放 · 空格拖动画布</span><span id="boxCount"></span></div></section>
<aside class="inspector"><section class="gt-panel" aria-label="当前图片完整 GT"><div class="section-title"><strong>本页 GT</strong><button id="copyGt" class="subtle">复制 GT</button></div><p class="gt-help">按当前标注顺序显示，点击文字定位框；彩色下划线表示待核提示。</p><div id="gtText" class="gt-text" aria-label="完整 GT，点击文字定位标注"></div><div id="gtMeta" class="gt-meta"></div></section><section class="issues"><div class="section-title"><strong>本页复核提示</strong><span id="issueCount"></span></div><div id="issues"></div></section><section class="editor"><div class="section-title"><strong id="selectionTitle">选择一个标注框</strong><span id="originIndex"></span></div><div id="emptySelection">点击图片中的框，修改对应文字与坐标。</div><div id="selectedIssues" class="selected-issues"></div><fieldset id="fields" disabled><label>标注文字（GT）<input id="labelInput" autocomplete="off" placeholder="无法释读时填写 □"></label><div class="coord-grid"><label>左 x<input id="x1" type="number" step="0.01"></label><label>上 y<input id="y1" type="number" step="0.01"></label><label>右 x<input id="x2" type="number" step="0.01"></label><label>下 y<input id="y2" type="number" step="0.01"></label></div><button id="applyLabel" class="primary wide">应用修改</button><div class="row"><button id="moveUp">上移顺序 ↑</button><button id="moveDown">下移顺序 ↓</button></div><label id="resolvedWrap" class="resolved-control"><input id="resolved" type="checkbox">此框提示已处理</label><button id="deleteBox" class="danger wide">删除此框</button></fieldset></section><section class="box-browser"><div class="section-title"><strong>标注顺序</strong><input id="boxSearch" placeholder="序号 / 文字" aria-label="查找标注框"></div><div id="boxList"></div></section></aside></main>
<dialog id="exportDialog"><form method="dialog"><button class="close" aria-label="关闭">×</button></form><h2>导出标注</h2><p>包含原图、LabelMe JSON、Pascal VOC XML、坐标和无换行 GT。</p><label>导出范围<select id="exportScope"><option value="current">当前图片</option><option value="reviewed">已完成复核</option><option value="edited">有草稿的图片</option><option value="all">全部问题图片</option></select></label><button id="downloadZip" class="primary wide">下载完整 ZIP 标注包</button><div class="row"><button id="downloadJson">当前图 JSON</button><button id="downloadXml">当前图 XML</button></div><p id="exportStatus" role="status" aria-live="polite" style="white-space:pre-wrap;color:#174b82"></p><button id="downloadReviewed" class="wide">下载已复核记录 JSON（不含原图，快速）</button><p id="outputLocation" class="output-location"></p><p class="muted">JSON 保留浮点坐标。XML 使用 Pascal VOC 的整数、1 起始坐标。GT 顺序与框顺序一致。</p></dialog><div id="toast" role="status" hidden></div><script type="module" src="app.js?v=20260929-source-refresh"></script></body></html>
