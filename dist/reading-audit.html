<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阅读方向复查</title><style>body{font:16px system-ui;margin:24px;color:#18324a;background:#f4f6f8}a{color:#1765a0}header{max-width:1100px}main{display:grid;grid-template-columns:260px 1fr;gap:20px}aside{max-height:80vh;overflow:auto}button{padding:9px;margin:3px;border:1px solid #b8cad8;border-radius:6px;background:white;cursor:pointer}aside button{display:block;width:95%;text-align:left}button.active{background:#daeaf9}section{background:white;padding:16px;border-radius:10px}svg{max-height:75vh;width:100%;background:#eee}#events{max-height:180px;overflow:auto}#events button{font-size:14px}.note{color:#875413}small{color:#5c7182}@media(max-width:750px){main{grid-template-columns:1fr}aside{max-height:220px}}</style><header><h1>从右到左、列内从上到下 · 阅读方向复查</h1><p id="summary"></p><p>已核看图像和坐标：<b>1-34、1-101、1-117、1-150</b> 原先整列从左往右录入，现已修复为从右往左。</p><p class="note">其他候选包含补标回跳、横排、表格和残卷分区，不直接判为错误。这 4 组已同步修改顺序和 GT；其余候选尚未修改。已修复页下方显示修复前证据，点击“打开前后对照”查看最新结果。</p><p><a href="order.html">返回顺序对照</a> · <a href="reading-audit/audit.json" download>下载完整检查记录</a></p></header><main><aside><input id="search" placeholder="搜索编号"><div id="list"></div></aside><section><h2 id="name"></h2><p id="status"></p><p><a id="all">查看当前完整 GT</a> · <a id="order">打开前后对照</a></p><div id="events"></div><p id="selected"></p><svg id="svg"></svg></section></main><script type="module">
const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';const d=await(await fetch('reading-audit/audit.json',{cache:'no-store'})).json();const live=await(await fetch('all/index.json',{cache:'no-store'})).json();const names=new Set(live.files.map(r=>r.name));const rows=d.files.filter(r=>r.events.length&&names.has(r.name)).sort((a,b)=>Number(d.confirmed.includes(b.name))-Number(d.confirmed.includes(a.name))||b.events.length-a.events.length);let current;
$('summary').textContent=`检查时共 ${d.images} 组，筛出 ${d.files.filter(r=>r.events.length).length} 组候选；4 组已修复，其余 45 组需复核。下方已隐藏检查后剔除的图片。`;
function list(){$('list').replaceChildren();for(const r of rows.filter(r=>r.name.includes($('search').value.trim()))){const b=document.createElement('button');b.textContent=`${r.name} · ${r.events.length} 处 · ${d.confirmed.includes(r.name)?'已修复':'待核'}`;b.className=r===current?'active':'';b.onclick=()=>open(r);$('list').append(b);}}
function el(t,a){const e=document.createElementNS(ns,t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e;}
function select(e){const svg=$('svg');svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${current.width} ${current.height}`);svg.append(el('image',{href:current.image,width:current.width,height:current.height}));const [a,b]=e.boxes;svg.append(el('line',{x1:(a[0]+a[2])/2,y1:(a[1]+a[3])/2,x2:(b[0]+b[2])/2,y2:(b[1]+b[3])/2,stroke:'#ed2939','stroke-width':2}));for(const [i,box]of e.boxes.entries()){const color=i?'#0072ce':'#ed2939';svg.append(el('rect',{x:box[0],y:box[1],width:box[2]-box[0],height:box[3]-box[1],fill:'none',stroke:color,'stroke-width':3}));const t=el('text',{x:box[0],y:box[1]-3,fill:color,'font-size':Math.max(12,current.width/45),'paint-order':'stroke',stroke:'white','stroke-width':2});t.textContent='#'+e.indices[i];svg.append(t);}$('selected').textContent=`红框 #${e.indices[0]}「${e.labels[0]}」 → 蓝框 #${e.indices[1]}「${e.labels[1]}」 · ${e.type==='up'?'同列短距离向上回跳':e.type==='columns'?'拟合字列后，下一列位于右侧':'明显向右跨区，需核对分区顺序'}`;}
function open(r){current=r;list();$('name').textContent=r.name;$('status').textContent=r.assessment+' · 标注人：'+r.annotator+'（来源 '+r.group+'）';$('all').href='all.html?image='+r.name;$('order').href='order.html?image='+r.name;$('events').replaceChildren();for(const e of r.events){const b=document.createElement('button');b.textContent='#'+e.indices.join(' → #');b.onclick=()=>select(e);$('events').append(b);}select(r.events[0]);history.replaceState(null,'','?image='+r.name);}
$('search').oninput=list;list();const wanted=new URLSearchParams(location.search).get('image');if(rows.length)open(rows.find(r=>r.name===wanted)||rows[0]);
</script></html>
