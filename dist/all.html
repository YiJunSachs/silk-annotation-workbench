<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silk · 全部筛选结果可视化</title><link rel="stylesheet" href="all.css?v=20260929-all168"></head><body>
<header><div class="brand"><b>帛</b><div><strong>Silk · 全部筛选结果</strong><small id="summary">正在加载筛选后的标注…</small></div></div><nav><a href="order.html">顺序调整前后</a><a href="./">标注复核工作台</a><a href="fragments.html">残卷讨论</a></nav></header>
<main><aside class="library"><div class="tools"><label>搜索编号或标注人<input id="search" type="search" placeholder="例如 1-50 / 王文轩" autocomplete="off"></label><label>筛选<select id="filter"><option value="all">全部图片</option><option value="issues">有自动检查项</option><option value="reviewed">已完成复核</option><option value="pending">工作台待复核</option></select></label><span id="visible" role="status"></span></div><div id="cards" class="cards" aria-label="筛选后的全部图片"></div></aside>
<section class="viewer"><div class="viewer-head"><div><h1 id="pageName">选择图片</h1><p id="pageMeta"></p></div><div class="view-actions"><label><input id="showBoxes" type="checkbox" checked>显示坐标框</label><label>缩放 <input id="zoom" type="range" min="50" max="400" value="100"><output id="zoomValue">100%</output></label><a id="orderLink" href="order.html">本页前后对照 ↗</a><a id="editLink" href="./" hidden>在工作台编辑 ↗</a></div></div><div id="imageScroll" class="image-scroll"><svg id="scene" xmlns="http://www.w3.org/2000/svg" aria-label="图片与坐标框"><image id="pageImage"/><g id="boxLayer"></g></svg></div><div id="selectedInfo" class="selected-info">点击图片中的框或右侧 GT，查看序号、文字和坐标。</div></section>
<aside class="gt-side"><h2>对应 GT <small id="gtCount"></small></h2><p>与坐标逐框同序；点字可定位图片中的框。</p><div id="gt" class="gt"></div></aside></main>
<script type="module" src="all.js?v=20260929-order1"></script></body></html>
